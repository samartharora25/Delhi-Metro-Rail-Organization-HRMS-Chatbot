<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMRC HRMS - Login</title>
  <link rel="icon" href="/static/Delhi_Metro_logo.svg.png" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Segoe UI,Tahoma,Verdana,sans-serif;background:#ffffff;color:#111827;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
    .container{width:100%;max-width:420px;margin-top:24px;padding:0 16px}
    .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;text-align:center}
    .brand img{width:110px;height:110px;object-fit:contain;margin-bottom:8px}
    .title{color:#1e3a8a;font-weight:700;font-size:20px;margin:8px 0}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:18px}
    .field{display:flex;align-items:center;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-top:12px;background:#fff}
    .icon{width:20px;color:#6b7280;margin-right:10px;text-align:center}
    .input{border:none;outline:none;flex:1;font-size:15px}
    .captcha-row{display:flex;align-items:center;gap:8px;margin-top:12px}
    .captcha-img{flex:1;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;height:40px;font-family:monospace;letter-spacing:6px;color:#111827}
    .captcha-refresh{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer}
    .btn{width:100%;margin-top:14px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border:none;color:#fff;border-radius:8px;padding:12px 14px;font-weight:700;font-size:16px;cursor:pointer}
    .btn:hover{filter:brightness(1.05)}
    .links{margin-top:10px;text-align:right}
    .links a{color:#3b82f6;text-decoration:none;font-size:13px}
    .nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    .nav .brand-mini{display:flex;align-items:center;gap:8px;font-weight:700;color:#1e3a8a}
    .nav .brand-mini img{width:28px;height:28px}
    .nav .links a{margin-left:12px;color:#1f2937;text-decoration:none;font-weight:600}
    .nav .links a:hover{color:#1e3a8a}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand-mini">
      <img src="/static/Delhi_Metro_logo.svg.png" alt="DMRC" />
      <span>DMRC HRMS</span>
    </div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/about">About us</a>
      <a href="/login">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="brand">
      <img src="/static/Delhi_Metro_logo.svg.png" alt="DMRC" />
    <div class="title">HRMS Chatbot</div>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="card" style="border-color:#fecaca;background:#fff1f2;color:#991b1b">
          {% for category, message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form class="card" method="POST" action="/login">
      <div class="field">
        <div class="icon">👤</div>
        <input class="input" type="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="field">
        <div class="icon">🔑</div>
        <input class="input" type="password" name="password" placeholder="Enter Your Password" required />
      </div>

      <div class="captcha-row">
        <input class="input" type="text" name="captcha" placeholder="Enter Captcha" style="flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px" />
        <div class="captcha-img" id="captchaText">6186</div>
        <div class="captcha-refresh" id="refreshBtn">🔄</div>
      </div>

      <button type="submit" class="btn">Sign in</button>
      <div class="links"><a href="#">Forgot your password?</a></div>
    </form>
  </div>

  <script>
    function randomCode(){return Math.floor(1000+Math.random()*9000).toString()}
    const captcha = document.getElementById('captchaText');
    const refresh = document.getElementById('refreshBtn');
    const setCode=()=>captcha.textContent=randomCode();
    refresh.addEventListener('click', setCode);
    window.addEventListener('load', setCode);
  </script>
</body>
</html>
